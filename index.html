<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f7f4ec;
    --paper-2:#efeadc;
    --ink:#1a1815;
    --accent:#f5b52a;
    --accent-2:#e89b12;
    --dim:#8a877e;
    --dim-2:#c8c4b6;
    --line:rgba(26,24,21,0.10);
  }
  html,body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter Tight','Noto Sans SC',-apple-system,sans-serif;
    height:100%;
    overflow:hidden;
    font-weight:500;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    position:relative;
    height:100vh;
    display:grid;
    grid-template-columns:repeat(12, 1fr);
    grid-template-rows:auto 1fr auto;
    gap:0;
    padding:20px 32px;
  }



  /* header row */
  header{
    grid-column:1/13;
    grid-row:1;
    display:grid;
    grid-template-columns: 220px 1fr 220px;
    gap:24px;
    align-items:end;
    padding-bottom:14px;
    border-bottom:1px solid var(--ink);
    z-index:2;
  }
  header .num{
    grid-column:1;
    align-self:start;
    font-family:'Space Mono',monospace;
    font-size:10px;
    font-weight:400;
    letter-spacing:2px;
    line-height:1;
    padding-top:4px;
    text-align:left;
  }
  header .title{
    grid-column:2;
    justify-self:center;
    font-family:'Noto Sans SC','Inter Tight',sans-serif;
    font-weight:900;
    font-size:34px;
    line-height:0.95;
    letter-spacing:-0.02em;
    display:flex;
    align-items:center;
    gap:14px;
    text-align:left;
  }
  header .title .icon{
    width:48px;height:48px;
    flex-shrink:0;
    display:block;
    transition:transform .4s cubic-bezier(.5,1.7,.6,1);
  }
  header .title:hover .icon{transform:rotate(-8deg) scale(1.05)}
  header .title .txt{display:flex;flex-direction:column;gap:2px}
  header .title small{
    display:block;font-weight:500;font-size:12px;color:var(--dim);
    letter-spacing:0.02em;margin-top:0;
    font-family:'Inter Tight','Noto Sans SC',sans-serif;
  }
  header .meta{
    grid-column:3;
    font-family:'Space Mono',monospace;
    font-size:10px;
    letter-spacing:1.5px;
    text-align:right;
    line-height:1.7;
  }
  header .meta .k{color:var(--dim)}
  header .meta .r{color:var(--accent);font-weight:700}

  /* content */
  .content{
    grid-column:1/13;
    grid-row:2;
    display:grid;
    grid-template-columns: 180px 1fr;
    gap: 32px;
    padding-top:16px;
    overflow:hidden;
    z-index:2;
  }
  .aside{
    display:flex;
    flex-direction:column;
    gap:10px;
    overflow-y:auto;
    padding-right:2px;
    scrollbar-width:none;
  }
  .aside::-webkit-scrollbar{display:none}
  .aside-card{
    background:#fff;
    border:1px solid var(--line);
    padding:12px 14px 14px;
    position:relative;
    transition:border-color .15s, box-shadow .15s;
  }
  .aside-card:hover{border-color:var(--ink);box-shadow:2px 2px 0 var(--accent)}
  .aside-card .card-label{
    font-family:'Space Mono',monospace;
    font-size:9px;
    letter-spacing:2px;
    color:var(--dim);
    text-transform:uppercase;
    margin-bottom:10px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:6px;
  }
  .aside-card .card-label::before{
    content:'';
    display:inline-block;
    width:8px;height:8px;
    background:var(--accent);
    flex-shrink:0;
  }
  .aside-card .row{
    padding:6px 0;
    line-height:1.4;
  }
  .aside-card .row + .row{
    border-top:1px dashed var(--line);
  }
  .aside-card .k{
    display:block;
    font-family:'Space Mono',monospace;
    font-size:9px;
    letter-spacing:1.8px;
    color:var(--dim);
    text-transform:uppercase;
    margin-bottom:3px;
  }
  .aside-card .v{
    display:block;
    font-family:'Inter Tight','Noto Sans SC',sans-serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  /* metric card：对话轮次 */
  .aside-card.metric{
    text-align:center;
    padding:14px 14px 16px;
  }
  .aside-card.metric .k{margin-bottom:6px;text-align:left}
  .aside-card.metric .metric-value{
    font-family:'Inter Tight',sans-serif;
    font-weight:900;
    font-size:38px;
    line-height:1;
    color:var(--ink);
    letter-spacing:-0.03em;
    text-align:left;
  }
  .aside-card.metric .metric-value sup{
    font-size:12px;
    font-weight:500;
    color:var(--dim);
    margin-left:4px;
    vertical-align:top;
    letter-spacing:0;
  }
  /* action buttons in a card container */
  .aside-actions{
    display:flex;flex-direction:column;gap:4px;
  }
  .aside-actions .toggle{
    display:flex;align-items:center;gap:8px;cursor:pointer;
    color:var(--ink);
    padding:9px 12px;
    border:1px solid var(--ink);
    background:#fff;
    font-family:'Space Mono',monospace;
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    text-align:left;
    transition:all .12s;
  }
  .aside-actions .toggle:hover{background:var(--accent);border-color:var(--ink)}
  .aside-actions .toggle.on{background:var(--ink);color:var(--paper)}
  .aside-actions .toggle .ico{
    display:inline-block;width:14px;text-align:center;color:var(--accent-2);
    font-size:12px;
  }
  .aside-actions .toggle:hover .ico,
  .aside-actions .toggle.on .ico{color:inherit}

  /* 兼容旧 API */
  .aside .toggle{
    display:flex;align-items:center;gap:8px;cursor:pointer;
    color:var(--ink);
    padding:9px 12px;
    border:1px solid var(--ink);
    background:#fff;
    font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;
    text-transform:uppercase;
    transition:all .12s;
  }
  .aside .toggle:hover{background:var(--accent)}
  .aside .toggle.on{background:var(--ink);color:var(--paper)}

  .feed{
    overflow-y:auto;
    padding-right:8px;
    display:flex;flex-direction:column;
    scrollbar-width:thin;scrollbar-color:var(--ink) transparent;
  }
  .feed::-webkit-scrollbar{width:4px}
  .feed::-webkit-scrollbar-thumb{background:var(--ink)}

  .msg{
    padding:14px 0;
    border-bottom:1px solid var(--line);
    display:grid;
    grid-template-columns: 56px 44px 1fr;
    gap:18px;
    align-items:start;
    animation:appear .3s ease;
  }
  @keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .msg .coord{
    font-family:'Space Mono',monospace;
    font-size:10px;
    letter-spacing:1.5px;
    color:var(--dim);
    line-height:1.6;
    padding-top:6px;
  }
  .msg .role{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    padding-top:2px;
  }
  .msg .avatar{
    width:36px;height:36px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  /* 助手头像：黄色笑脸，思考时摇头 */
  .msg.agent .avatar img{
    width:36px;height:36px;
    display:block;
    transition:transform .3s ease;
  }
  .msg.agent:not(.thinking):hover .avatar img{transform:rotate(-6deg) scale(1.05)}
  .msg.agent.thinking .avatar img{animation:wobble 1.6s ease-in-out infinite}
  @keyframes wobble{
    0%,100%{transform:rotate(-8deg)}
    50%{transform:rotate(8deg)}
  }
  /* 助手头像：思考时环绕的黄色光晕 */
  .msg.agent.thinking .avatar::after{
    content:'';position:absolute;inset:-4px;
    border-radius:50%;
    border:2px solid var(--accent);
    border-top-color:transparent;
    animation:spin 1.2s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 用户头像：瑞士风格黑填充圆 + "你" */
  .msg.user .avatar{
    width:36px;height:36px;
    background:var(--ink);
    border-radius:50%;
    color:var(--paper);
    font-family:'Noto Sans SC',sans-serif;
    font-weight:900;
    font-size:15px;
    letter-spacing:0;
    line-height:1;
    /* 小刻意偏移，呼应涂鸦的手感 */
    transform:rotate(-2deg);
    transition:transform .3s ease;
    box-shadow:2px 2px 0 var(--accent);
  }
  .msg.user:hover .avatar{transform:rotate(0deg) translate(-1px,-1px);box-shadow:3px 3px 0 var(--accent)}

  .msg .role .label{
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    line-height:1;
    font-weight:700;
  }
  .msg.user .role .label{color:var(--accent-2)}
  .msg.agent .role .label{color:var(--ink)}

  .msg .body{
    font-size:16px;
    line-height:1.65;
    letter-spacing:-0.005em;
    word-break:break-word;
    padding-top:2px;
  }
  .msg .body.plain{white-space:pre-wrap}
  /* markdown styles inside agent body */
  .msg.agent .body h2,
  .msg.agent .body h3,
  .msg.agent .body h4{
    font-family:'Noto Sans SC','Inter Tight',sans-serif;
    font-weight:700;
    letter-spacing:-0.01em;
    margin:14px 0 6px;
    line-height:1.3;
  }
  .msg.agent .body h2{font-size:19px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .msg.agent .body h3{font-size:17px;color:var(--ink)}
  .msg.agent .body h4{font-size:15px;color:var(--ink)}
  .msg.agent .body h2:first-child,
  .msg.agent .body h3:first-child,
  .msg.agent .body h4:first-child{margin-top:0}
  .msg.agent .body p{margin:6px 0}
  .msg.agent .body p:first-child{margin-top:0}
  .msg.agent .body p:last-child{margin-bottom:0}
  .msg.agent .body strong{font-weight:700;color:var(--ink)}
  .msg.agent .body em{font-style:italic;color:var(--dim)}
  .msg.agent .body ul,
  .msg.agent .body ol{margin:4px 0 8px 22px;padding:0}
  .msg.agent .body li{margin:1px 0;padding-left:2px;line-height:1.5}
  .msg.agent .body li p{margin:0}
  .msg.agent .body ul li::marker{color:var(--accent)}
  .msg.agent .body ol li::marker{color:var(--accent);font-family:'Space Mono',monospace;font-weight:700}
  .msg.agent .body code{
    background:rgba(245,181,42,0.15);
    color:var(--ink);
    padding:1px 6px;
    border-radius:3px;
    font-family:'Space Mono',monospace;
    font-size:0.9em;
  }
  .msg.agent .body pre{
    background:rgba(26,24,21,0.06);
    padding:12px 14px;
    border-radius:4px;
    border-left:3px solid var(--accent);
    margin:8px 0;
    overflow-x:auto;
  }
  .msg.agent .body pre code{background:none;padding:0;font-size:13px}
  .msg.agent .body blockquote{
    border-left:3px solid var(--accent);
    padding:2px 12px;
    margin:8px 0;
    color:var(--dim);
    font-size:14px;
    background:rgba(245,181,42,0.06);
  }
  .msg.agent .body hr{
    border:none;border-top:1px solid var(--line);margin:12px 0;
  }
  .msg.agent .body a{color:var(--accent-2);text-decoration:underline}
  .msg.user .body{font-weight:600}
  .msg.agent .body{font-weight:500}

  /* --------- 问答表单卡片 --------- */
  .msg.agent .body .qform{
    margin:14px 0;
    border:1px solid var(--line);
    background:rgba(245,181,42,0.05);
    border-left:3px solid var(--accent);
    padding:14px 18px 16px;
  }
  .msg.agent .body .qform-head{
    font-family:'Noto Sans SC','Inter Tight',sans-serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:-0.005em;
    color:var(--ink);
    padding-bottom:10px;
    margin-bottom:10px;
    border-bottom:1px dashed var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  .msg.agent .body .qform-head .qnum{
    display:inline-block;
    background:var(--ink);
    color:var(--paper);
    padding:2px 8px;
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:12px;
    letter-spacing:1px;
    font-style:normal;
    margin-right:10px;
    vertical-align:2px;
  }
  .msg.agent .body .qform-head .hint{
    font-family:'Space Mono',monospace;
    font-size:10px;letter-spacing:1.5px;
    color:var(--dim);font-weight:400;text-transform:uppercase;
    white-space:nowrap;
  }
  .msg.agent .body .qform-sub{
    font-size:13px;
    color:var(--ink-soft, var(--dim));
    padding:6px 0 4px;
    margin-top:-6px;
    margin-bottom:8px;
    font-style:italic;
    letter-spacing:0.02em;
  }
  .msg.agent .body .qform-opts{
    display:flex;flex-direction:column;gap:4px;
  }
  .msg.agent .body .qform .opt{
    display:grid;
    grid-template-columns:auto 24px 1fr;
    align-items:center;
    gap:10px;
    padding:8px 10px;
    cursor:pointer;
    border-radius:3px;
    transition:background .15s;
    font-size:15px;
    font-weight:500;
    line-height:1.5;
  }
  .msg.agent .body .qform .opt:hover{background:rgba(245,181,42,0.1)}
  .msg.agent .body .qform .opt input[type=checkbox]{
    -webkit-appearance:none;appearance:none;
    width:18px;height:18px;
    border:2px solid var(--ink);
    background:transparent;
    cursor:pointer;
    position:relative;
    margin:0;flex-shrink:0;
    transition:all .15s;
  }
  .msg.agent .body .qform .opt input[type=checkbox]:checked{
    background:var(--accent);
    border-color:var(--ink);
  }
  .msg.agent .body .qform .opt input[type=checkbox]:checked::after{
    content:'';
    position:absolute;
    left:3px;top:-1px;
    width:6px;height:11px;
    border:solid var(--ink);
    border-width:0 2.5px 2.5px 0;
    transform:rotate(45deg);
  }
  .msg.agent .body .qform .opt .letter{
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:12px;
    letter-spacing:1px;
    color:var(--accent-2);
    text-align:center;
  }
  .msg.agent .body .qform .opt.checked{background:rgba(245,181,42,0.12)}
  .msg.agent .body .qform .opt.checked .letter{color:var(--ink)}
  .msg.agent .body .qform .other-wrap{
    margin-top:6px;
    grid-column:3/-1;
    padding-left:0;
  }
  .msg.agent .body .qform .other-txt{
    width:100%;
    background:transparent;
    border:none;border-bottom:1px solid var(--dim);
    padding:4px 2px;
    font-family:'Noto Sans SC','Inter Tight',sans-serif;
    font-size:14px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  .msg.agent .body .qform .other-txt:focus{border-bottom-color:var(--accent-2)}
  .msg.agent .body .qform .other-txt:disabled{opacity:.4}

  .msg.agent .body .qform-actions{
    margin-top:16px;
    display:flex;justify-content:flex-end;gap:8px;
    padding-top:12px;
    border-top:1px dashed var(--line);
  }
  .msg.agent .body .qform-actions .btn-fill{
    background:var(--ink);color:var(--paper);
    border:2px solid var(--ink);
    padding:8px 18px;
    font-family:'Noto Sans SC','Inter Tight',sans-serif;
    font-weight:700;font-size:13px;letter-spacing:0.05em;
    cursor:pointer;
    transition:all .15s;
  }
  .msg.agent .body .qform-actions .btn-fill:hover{background:var(--accent);color:var(--ink)}
  .msg.agent .body .qform-actions .btn-fill.done{background:var(--accent);color:var(--ink)}

  /* --------- 附件条 & 上传按钮 --------- */
  .attach-bar{
    display:none;
    flex-wrap:wrap;gap:6px;
    padding:8px 0 6px;
  }
  .attach-bar.on{display:flex}
  .attach-chip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--paper-2);
    border:1px solid var(--ink);
    padding:4px 6px 4px 10px;
    font-size:12px;
    font-family:'Noto Sans SC','Inter Tight',sans-serif;
    letter-spacing:0.01em;
    max-width:280px;
  }
  .attach-chip .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
  .attach-chip.uploading{opacity:.6}
  .attach-chip.err{background:rgba(227,6,19,0.1);border-color:#c53030;color:#c53030}
  .attach-chip .kind{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
  .attach-chip .rm{
    background:transparent;border:none;cursor:pointer;
    color:var(--dim);
    padding:2px 4px;line-height:1;
    font-family:inherit;font-size:14px;
  }
  .attach-chip .rm:hover{color:var(--accent-2)}
  .attach-chip svg{width:12px;height:12px;flex-shrink:0}

  .compose-tools{
    display:flex;gap:4px;align-items:center;
    padding-right:8px;
  }
  .compose-tools .tool-btn{
    background:transparent;
    border:1px solid transparent;
    padding:6px 8px;
    cursor:pointer;
    color:var(--dim);
    display:flex;align-items:center;justify-content:center;
    transition:all .15s;
  }
  .compose-tools .tool-btn:hover{color:var(--ink);border-color:var(--line)}
  .compose-tools .tool-btn svg{width:16px;height:16px}

  .thinking .body::after{
    content:'';display:inline-block;
    width:10px;height:14px;background:var(--accent);
    margin-left:6px;vertical-align:baseline;
    animation:blink 0.9s steps(2) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  /* footer / composer */
  footer{
    grid-column:1/13;
    grid-row:3;
    border-top:1px solid var(--ink);
    padding-top:12px;
    display:grid;
    grid-template-columns:repeat(12, 1fr);
    gap:14px;
    align-items:end;
    z-index:2;
  }
  footer .label{
    grid-column:1/3;
    font-family:'Space Mono',monospace;
    font-size:10px;letter-spacing:2px;
    color:var(--dim);
    text-transform:uppercase;
    line-height:1.5;
  }
  footer .label b{
    color:var(--ink);display:block;font-family:'Inter Tight',sans-serif;font-size:14px;letter-spacing:-0.01em;
    font-weight:900;text-transform:none;
  }
  footer .input-wrap{
    grid-column:3/11;
    display:flex;flex-direction:column;
    border-bottom:2px solid var(--ink);
    padding-bottom:6px;
  }
  footer .input-wrap .input-row{
    display:flex;align-items:flex-end;gap:12px;
  }
  footer .input-wrap .prefix{
    font-family:'Space Mono',monospace;font-size:12px;
    color:var(--accent);letter-spacing:2px;font-weight:700;
  }
  footer .ta-wrap{
    flex:1;
    min-width:0;
    /* 不要用 flex column，会让 textarea 的显式 height 失效 */
  }
  footer .ta-drag{
    height:10px;
    cursor:ns-resize;
    position:relative;
    margin:0 0 2px;
    transition:background .15s;
    border-radius:2px;
    user-select:none;
    -webkit-user-select:none;
  }
  footer .ta-drag::before{
    content:'';
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:32px;
    height:3px;
    background:var(--dim);
    border-radius:2px;
    opacity:0.5;
    transition:opacity .15s, background .15s, width .15s, height .15s;
    pointer-events:none;
  }
  footer .ta-drag:hover{background:rgba(245,181,42,0.12)}
  footer .ta-drag:hover::before{opacity:1;background:var(--accent-2);width:44px}
  footer .ta-drag.dragging{background:rgba(245,181,42,0.25)}
  footer .ta-drag.dragging::before{opacity:1;background:var(--accent-2);width:44px;height:4px}
  footer input,footer textarea{
    display:block;
    width:100%;
    background:transparent;border:none;outline:none;
    font-family:'Inter Tight','Noto Sans SC',sans-serif;
    font-size:18px;font-weight:500;
    color:var(--ink);
    padding:6px 0;letter-spacing:-0.005em;
    resize:none;
    line-height:1.4;
    min-height:32px;
    max-height:500px;
    overflow-y:auto;
    box-sizing:border-box;
  }
  footer input::placeholder,footer textarea::placeholder{color:var(--dim);font-weight:500}
  footer .send{
    grid-column:11/13;
    background:var(--ink);color:var(--paper);
    border:none;padding:16px 0;
    font-family:'Inter Tight',sans-serif;
    font-weight:900;font-size:14px;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:background .15s;
    text-align:center;
    text-transform:uppercase;
  }
  footer .send:hover:not(:disabled){background:var(--accent)}
  footer .send:disabled{background:var(--dim);cursor:not-allowed}
  footer .footnote{
    grid-column:1/13;
    padding-top:12px;
    font-family:'Space Mono',monospace;
    font-size:10px;letter-spacing:1.5px;
    color:var(--dim);
    display:flex;justify-content:space-between;
  }
  footer .footnote .r{color:var(--accent)}

  @media (max-width:820px){
    .app{padding:20px}
    header{grid-template-columns:1fr;gap:8px}
    header .title{font-size:28px;gap:12px;grid-column:1;justify-self:start}
    header .title .icon{width:48px;height:48px}
    header .title small{font-size:12px}
    header .meta{display:none}
    header .num{display:none}
    .content{padding-top:20px;grid-template-columns:1fr;gap:0}
    .aside{display:none}
    .feed{grid-column:auto}
    .msg{grid-template-columns:44px 36px 1fr;gap:12px;padding:16px 0}
    .msg .coord{font-size:9px;padding-top:4px}
    .msg .avatar{width:30px;height:30px}
    .msg.agent .avatar img{width:30px;height:30px}
    .msg.user .avatar{width:30px;height:30px;font-size:13px}
    .msg .role .label{font-size:9px;letter-spacing:1.5px}
    .msg.user .body,.msg.agent .body{font-size:15px}
    footer{grid-template-columns:1fr auto}
    footer .label{display:none}
    footer .input-wrap{grid-column:1/2}
    footer .send{grid-column:2/3;padding:16px 20px}
    footer .footnote{grid-column:1/3}
    footer input,footer textarea{font-size:16px}
  }
</style>
</head>
<body>

<div class="app">

  <header>

/* ---------- 极简 Markdown 渲染器 ---------- */
function escHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderMD(src){
  if(!src) return '';
  // 保护 fenced code blocks（先抽出，最后回填）
  const codeBlocks=[];
  src = src.replace(/```([a-zA-Z0-9_-]*)\n?([\s\S]*?)```/g,(_,lang,code)=>{
    codeBlocks.push(`<pre><code>${escHTML(code.replace(/\n$/,''))}</code></pre>`);
    return `\x00CODE${codeBlocks.length-1}\x00`;
  });

  let s = escHTML(src);

  // inline code
  s = s.replace(/`([^`\n]+)`/g,(_,c)=>`<code>${c}</code>`);

  // headings (支持 h1~h4，其它按 h4)
  s = s.replace(/^#{4,6} (.+)$/gm,'<h4>$1</h4>');
  s = s.replace(/^### (.+)$/gm,'<h4>$1</h4>');
  s = s.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  s = s.replace(/^# (.+)$/gm,'<h2>$1</h2>');

  // bold + italic
  s = s.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/(?<![\*\w])\*([^*\n]+)\*(?![\*\w])/g,'<em>$1</em>');

  // 分割线
  s = s.replace(/^\s*---+\s*$/gm,'<hr>');

  // blockquote (需要在转义之后，用 &gt;)
  s = s.replace(/(?:^&gt; .+(?:\n|$))+/gm,block=>{
    const inner = block.split(/\n/).filter(l=>l.startsWith('&gt; ')).map(l=>l.slice(5)).join('<br>');
    return `<blockquote>${inner}</blockquote>\n`;
  });

  // 列表：把连续的 - / * / • / 数字. 行归拢到 <ul>/<ol>
  const lines = s.split('\n');
  const out = [];
  let inUl=false, inOl=false;
  const closeLists=()=>{
    if(inUl){out.push('</ul>');inUl=false}
    if(inOl){out.push('</ol>');inOl=false}
  };
  for(const line of lines){
    const ul = line.match(/^\s*[-*•·]\s+(.+)$/);
    const ol = line.match(/^\s*(\d+)[.\)]\s+(.+)$/);
    if(ul){
      if(inOl){out.push('</ol>');inOl=false}
      if(!inUl){out.push('<ul>');inUl=true}
      out.push(`<li>${ul[1]}</li>`);
    } else if(ol){
      if(inUl){out.push('</ul>');inUl=false}
      if(!inOl){out.push('<ol>');inOl=true}
      out.push(`<li>${ol[2]}</li>`);
    } else {
      closeLists();
      out.push(line);
    }
  }
  closeLists();
  s = out.join('\n');

  // 合并相邻的 <ul> 和 <ol>（源码里选项之间的空行不该把列表撕成多个）
  s = s.replace(/<\/ul>\s*<ul>/g, '');
  s = s.replace(/<\/ol>\s*<ol>/g, '');

  // 段落：连续空行分段，其它单换行变 <br>
  const paras = s.split(/\n{2,}/).map(p=>p.trim()).filter(Boolean);
  s = paras.map(p=>{
    // 已经是块级标签的直接原样返回
    if(/^<(h[1-6]|ul|ol|pre|blockquote|hr|table)/i.test(p)) return p;
    return '<p>' + p.replace(/\n/g,'<br>') + '</p>';
  }).join('\n');

  // 再合并一次（段落合并后可能又产生了相邻 ul/ol）
  s = s.replace(/<\/ul>\s*<ul>/g, '');
  s = s.replace(/<\/ol>\s*<ol>/g, '');

  // 回填 code blocks
  s = s.replace(/\x00CODE(\d+)\x00/g,(_,i)=>codeBlocks[+i]||'');
  return s;
}

async function stream(text,attachments,onDelta){
  await ensureConv();
  // 通过CF Function代理流式对话
  const resp=await fetch(`/api/chat`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({content:text,attachments:attachments||[],AGENT_ID})
  });
  if(!resp.ok) throw new Error('HTTP '+resp.status);
  const reader=resp.body.getReader();
  const dec=new TextDecoder();
  let buf='',db=''; const pt={},seen=new Set(); let done=false;

  // finish reason 白名单：这些代表模型还有后续（工具调用中间态），不能断流
  const CONTINUE_REASONS = new Set(['tool_calls','tool-calls','tool_use','tool-use','function_call','function-call','tools']);
  // finish reason：真结束的信号
  const TERMINAL_REASONS = new Set(['stop','end','end_turn','completed','done','length','content_filter']);

  let toolPartActive = false; // 用于插入工具调用分隔提示

  while(!done){
    const {done:d,value}=await reader.read(); if(d) break;
    buf+=dec.decode(value,{stream:true});
    let idx;
    while((idx=buf.indexOf('\n'))!==-1){
      const line=buf.slice(0,idx).replace(/\r$/,'');
      buf=buf.slice(idx+1);
      if(line.startsWith('data:')) db+=line.slice(5)+'\n';
      else if(line===''){
        const p=db.trim(); db='';
        if(!p) continue;
        let outer; try{outer=JSON.parse(p)}catch{continue}
        let inner=outer.data;
        if(typeof inner==='string'){try{inner=JSON.parse(inner)}catch{continue}}
        if(!inner||typeof inner!=='object') continue;
        const t=inner.type;

        if(t==='message.part.updated'){
          const part=(inner.properties&&inner.properties.part)||{};
          if(part.id) pt[part.id]=part.type;
          // 工具调用类 part：给用户一个"正在调用工具…"的可视化提示
          const ptype = part.type || '';
          if(/tool|invocation|function/i.test(ptype) && !toolPartActive){
            toolPartActive = true;
            onDelta('\n\n> ⚙ 正在调用工具…\n\n');
          }
          // 新的 text part 到来（工具调用后的第二段）→ 关闭工具提示
          if(part.type==='text' && toolPartActive){
            toolPartActive = false;
          }
          if(part.type==='text' && !seen.has(part.id) && part.text){
            seen.add(part.id); onDelta(part.text);
          }
        } else if(t==='message.part.delta'){
          const pp=inner.properties||{};
          if(pp.field==='text' && pt[pp.partID]==='text'){
            seen.add(pp.partID);
            onDelta(pp.delta || '');
          }
        } else if(t==='message.updated'){
          const info=(inner.properties&&inner.properties.info)||{};
          if(info.role==='assistant' && 'finish' in info){
            const reason = String(info.finish || '').toLowerCase();
            // 工具调用类的中间态 finish：忽略，继续等真结束
            if(CONTINUE_REASONS.has(reason)){
              // console.log('[stream] mid finish (tool call), continue:', reason);
              continue;
            }
            // 其它都当结束
            done = true; break;
          }
        } else if(t==='run.terminal' || t==='session.done' || t==='run.completed' || t==='run.finished'){
          // 兜底：真正的运行终点
          done = true; break;
        }
      }
    }
  }
  try{reader.cancel()}catch(_){}
}

/* ---------- Q&A 表单转换（把 markdown 里的 Q1 + A/B/C 列表变成可勾选表单） ---------- */
function enhanceQuestions(html){
  let qCount = 0;

  // 从问题里去掉常见的编号前缀（避免和自动编号重复）
  function stripPrefix(q){
    return q
      .replace(/^\s*(?:Q?\s*\d+[.．、｜|:：)]\s*)+/i, '')
      .replace(/^\s*[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮1️⃣2️⃣3️⃣4️⃣5️⃣6️⃣7️⃣8️⃣9️⃣🔟]\s*/, '')
      .replace(/^\s*[【\[]\s*\d+\s*[】\]]\s*/, '')
      // 尾部冒号也剥掉
      .replace(/[:：]\s*$/,'')
      .trim();
  }

  // 从 <li> 的内容里抽出「字母+分隔符+文本」
  // 兼容：A. xxx / A、xxx / A．xxx / (A) xxx / Ａ、xxx / ①xxx / ①. xxx / a. xxx / 1) xxx
  function parseOption(inner){
    // 先剥掉外层可选的粗体
    let s = inner.trim().replace(/^<strong>([\s\S]*)<\/strong>$/,'$1');
    // 大写/小写字母 + 分隔符
    let m = s.match(/^\s*[（(]?\s*([A-Za-zＡ-Ｚａ-ｚ])\s*[）)．.、,，:：]\s+([\s\S]+)$/);
    if(m) return {letter: m[1].toUpperCase(), text: m[2].trim()};
    // 字母 + 空格（无标点）
    m = s.match(/^\s*[（(]?\s*([A-Za-zＡ-Ｚａ-ｚ])\s*[）)]?\s+([\s\S]{2,})$/);
    if(m) return {letter: m[1].toUpperCase(), text: m[2].trim()};
    // 圆圈数字/字母
    m = s.match(/^\s*([①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳ⓐⓑⓒⓓⓔ])\s*[）).．、,，:：]?\s*([\s\S]+)$/);
    if(m){
      const circleToLetter = {'①':'A','②':'B','③':'C','④':'D','⑤':'E','⑥':'F','⑦':'G','⑧':'H','⑨':'I','⑩':'J','⑪':'K','⑫':'L','⑬':'M','⑭':'N','⑮':'O','⑯':'P','⑰':'Q','⑱':'R','⑲':'S','⑳':'T','ⓐ':'A','ⓑ':'B','ⓒ':'C','ⓓ':'D','ⓔ':'E'};
      return {letter: circleToLetter[m[1]] || m[1], text: m[2].trim()};
    }
    // 数字 + 分隔符（1) xxx / 1. xxx）— 也当作字母 1/2/3
    m = s.match(/^\s*(\d{1,2})\s*[）)．.、]\s+([\s\S]+)$/);
    if(m) return {letter: m[1], text: m[2].trim()};
    return null;
  }

  // 从一个"疑似问题块"里抽出问题文本 + 附加提示
  function extractQuestion(el){
    if(!el) return null;
    const tag = el.tagName;
    if(!tag) return null;
    // 忽略太短或空
    if((el.textContent||'').trim().length < 4) return null;

    if(/^H[1-6]$/.test(tag)){
      return { text: el.textContent.trim(), hint: '' };
    }
    if(tag === 'P'){
      const strong = el.querySelector(':scope > strong');
      if(strong){
        // 强调部分是问题主体，其余是提示
        const clone = el.cloneNode(true);
        clone.querySelectorAll(':scope > strong').forEach(s=>s.remove());
        return { text: strong.textContent.trim(), hint: (clone.textContent||'').trim() };
      }
      // 纯段落
      const text = el.textContent.trim();
      // 纯段落必须像个问题：以 ? / ? / 冒号 / "选" / "是" 之类结尾，或者足够短
      if(/[?？:：]$/.test(text) || /^(?:请|你|哪|多久|需要|想|打算)/.test(text) || text.length <= 60){
        return { text: text.replace(/[:：]$/,''), hint: '' };
      }
      return null;
    }
    if(tag === 'OL'){
      const li = el.querySelector(':scope > li');
      if(!li) return null;
      // 如果 ol 只有一个 li 且里面是"疑似问题"，用它做问题
      if(el.children.length === 1){
        const strong = li.querySelector(':scope > strong');
        if(strong){
          const clone = li.cloneNode(true);
          clone.querySelectorAll(':scope > strong').forEach(s=>s.remove());
          return { text: strong.textContent.trim(), hint: (clone.textContent||'').trim() };
        }
        return { text: li.textContent.trim(), hint: '' };
      }
    }
    if(tag === 'BLOCKQUOTE'){
      return { text: el.textContent.trim(), hint: '' };
    }
    return null;
  }

  // DOM 解析
  const wrap = document.createElement('div');
  wrap.innerHTML = html;

  const uls = [...wrap.querySelectorAll('ul')];
  uls.forEach(ul=>{
    // 跳过嵌套在 li 里的子 ul
    if(ul.closest('li')) return;
    // 跳过已经在 qform 内部的
    if(ul.closest('.qform')) return;

    const items = [...ul.querySelectorAll(':scope > li')];
    if(items.length < 2) return;

    const parsed = items.map(li => parseOption(li.innerHTML));
    const validOpts = parsed.filter(x=>x);
    // 至少 2 个 + 至少占 60% 匹配
    if(validOpts.length < 2) return;
    if(validOpts.length / items.length < 0.6) return;
    // 字母不能全一样（避免误判）
    const letters = new Set(validOpts.map(o=>o.letter));
    if(letters.size < 2) return;

    // 找问题：向前找非空的兄弟块
    let prev = ul.previousElementSibling;
    while(prev){
      const t = (prev.textContent||'').trim();
      if(t) break;
      prev = prev.previousElementSibling;
    }
    if(!prev) return;

    const q = extractQuestion(prev);
    if(!q) return;

    // 构建 qform
    qCount++;
    const qid = 'qf_' + Math.random().toString(36).slice(2,8);
    const cleanQ = stripPrefix(q.text);
    const hint = (q.hint || '').replace(/^[\s（(]+|[\s）)]+$/g,'').trim();
    const optsHtml = validOpts.map(({letter, text})=>{
      const isOther = /其[它他]|没想好|other|建议|随便|自定|帮我梳理|帮我理|自己/i.test(text);
      // text 里可能残留 <strong> 之类小标签，为安全起见去掉
      const safeText = text;
      return `<label class="opt" data-letter="${letter}">
        <input type="checkbox" name="${qid}" value="${letter}"/>
        <span class="letter">${letter}</span>
        <span class="text">${safeText}</span>
        ${isOther ? `<div class="other-wrap"><input type="text" class="other-txt" placeholder="补充说明…" disabled/></div>` : ''}
      </label>`;
    }).join('');
    const hintHtml = hint ? `<div class="qform-sub">${hint}</div>` : '';

    const qform = document.createElement('div');
    qform.className = 'qform';
    qform.dataset.idx = qCount;
    qform.dataset.qid = qid;
    qform.dataset.question = cleanQ;
    qform.innerHTML = `<div class="qform-head">
      <span><em class="qnum">Q${qCount}</em>${cleanQ}</span>
      <span class="hint">多选 / 可留空</span>
    </div>
    ${hintHtml}
    <div class="qform-opts">${optsHtml}</div>`;

    // 移除原来的问题块和 ul，插入 qform
    prev.parentNode.insertBefore(qform, prev);
    prev.remove();
    ul.remove();
  });

  return wrap.innerHTML;
}

function attachQFormEvents(bodyEl){
  const forms = bodyEl.querySelectorAll('.qform');
  if(!forms.length) return;
  forms.forEach(form=>{
    form.querySelectorAll('.opt').forEach(opt=>{
      const cb = opt.querySelector('input[type=checkbox]');
      const otherTxt = opt.querySelector('.other-txt');
      const sync = ()=>{
        opt.classList.toggle('checked', cb.checked);
        if(otherTxt){
          otherTxt.disabled = !cb.checked;
          if(cb.checked) setTimeout(()=>otherTxt.focus(), 30);
        }
      };
      cb.addEventListener('change', sync);
      // 点整个 label 时，别在 input 上点两次
      opt.addEventListener('click', e=>{
        if(e.target.tagName==='INPUT' && e.target.type==='text') e.stopPropagation();
      });
    });
  });
  // 在最后一个 qform 后追加"填入答案"按钮（如果还没有）
  if(!bodyEl.querySelector('.qform-actions')){
    const actions = document.createElement('div');
    actions.className = 'qform-actions';
    actions.innerHTML = `<button class="btn-fill" type="button">整理答案填入输入框 →</button>`;
    // 找最后一个 qform，把 actions 插入其后
    const lastForm = bodyEl.querySelectorAll('.qform');
    const lastEl = lastForm[lastForm.length-1];
    lastEl.parentNode.insertBefore(actions, lastEl.nextSibling);
    actions.querySelector('.btn-fill').addEventListener('click', ()=>fillAnswersToInput(bodyEl, actions));
  }
}

function fillAnswersToInput(bodyEl, actionsEl){
  const forms = bodyEl.querySelectorAll('.qform');
  const lines = [];
  forms.forEach(form=>{
    const q = form.dataset.question;
    const idx = form.dataset.idx;
    const checked = [...form.querySelectorAll('.opt')].filter(o=>o.querySelector('input[type=checkbox]').checked);
    if(!checked.length) return;
    const parts = checked.map(o=>{
      const letter = o.dataset.letter;
      const txt = o.querySelector('.text').textContent.trim();
      const otherTxt = o.querySelector('.other-txt');
      if(otherTxt && otherTxt.value.trim()){
        return `${letter}. ${otherTxt.value.trim()}`;
      }
      return `${letter}. ${txt}`;
    });
    lines.push(`【Q${idx}】${q}\n  → ${parts.join('；')}`);
  });
  if(!lines.length){
    const btn = actionsEl.querySelector('.btn-fill');
    const old = btn.textContent; btn.textContent = '还没勾选任何选项';
    setTimeout(()=>{btn.textContent = old}, 1600);
    return;
  }
  const answerText = lines.join('\n\n');
  const cur = inp.value.trim();
  inp.value = (cur ? cur + '\n\n' : '') + answerText;
  inp.dispatchEvent(new Event('input'));
  inp.focus();
  const btn = actionsEl.querySelector('.btn-fill');
  const old = btn.textContent;
  btn.classList.add('done');
  btn.textContent = '✓ 已填入 ' + lines.length + ' 题，可以直接按发送';
  setTimeout(()=>{btn.textContent = old; btn.classList.remove('done')}, 2200);
}

async function submit(){
  const t=inp.value.trim();
  // 允许有附件时空文本，也允许有文本无附件
  const hasAttachments = pendingAttachments.some(a=>a.status==='ok');
  if((!t && !hasAttachments) || busy) return;
  // 有正在上传的附件，等一下
  if(pendingAttachments.some(a=>a.status==='uploading')){
    flashSend('等附件上传完…');
    return;
  }
  const attachments = pendingAttachments
    .filter(a=>a.status==='ok' && a.kind==='file' && a.url)
    .map(a=>({url:a.url, filename:a.filename}));

  // 用户消息展示：正文 + 附件小结
  let displayText = t;
  const okAttachs = pendingAttachments.filter(a=>a.status==='ok');
  if(okAttachs.length){
    const list = okAttachs.map(a=>`  📎 ${a.filename}`).join('\n');
    displayText = (t?t+'\n\n':'') + '（附件）\n' + list;
  }
  add('user', displayText);
  inp.value=''; manualHeight=null; inp.style.height='auto';
  pendingAttachments = []; renderAttachBar();
  busy=true; send.disabled=true;
  turns++; if(turnCnt) turnCnt.textContent = String(turns).padStart(2,'0');
  const {el,body}=add('agent','');
  el.classList.add('thinking');
  let raw='';
  let rafPending=false;
  const flush=(finalize=false)=>{
    body.dataset.raw = raw;
    if(finalize){
      body.innerHTML = enhanceQuestions(renderMD(raw));
      attachQFormEvents(body);
    } else {
      body.innerHTML = renderMD(raw);
    }
    feed.scrollTop = feed.scrollHeight;
    rafPending=false;
  };
  try{
    await stream(t || '（用户上传了附件）', attachments, d => {
      raw += d;
      if(!rafPending){ rafPending=true; requestAnimationFrame(()=>flush(false)); }
    });
    flush(true);  // 结束后再做表单增强
    el.classList.remove('thinking');
  }catch(e){
    el.classList.remove('thinking');
    raw = (raw ? raw + '\n\n' : '') + '**错误** · ' + (e.message || e);
    body.dataset.raw = raw;
    body.innerHTML = enhanceQuestions(renderMD(raw));
    attachQFormEvents(body);
  }finally{ busy=false; send.disabled=false; inp.focus(); }
}

function flashSend(msg){
  const old = send.textContent;
  send.textContent = msg;
  send.disabled = true;
  setTimeout(()=>{send.textContent=old; send.disabled=false}, 1200);
}
send.addEventListener('click',submit);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}});

/* 输入框：自动增长 + 可手动拖顶部调整高度 */
let manualHeight = null;   // 用户手动拖过就锁定为这个值
const INP_MIN = 32;
const INP_AUTO_MAX = 240;  // 自动增长上限
const INP_MANUAL_MAX = 500;// 手动拖动上限

function autoGrow(){
  if(manualHeight !== null){
    // 手动模式：只在内容溢出时向下增长，不主动缩
    if(inp.scrollHeight > manualHeight){
      const h = Math.min(inp.scrollHeight, INP_MANUAL_MAX);
      inp.style.height = h + 'px';
      manualHeight = h;
    } else {
      inp.style.height = manualHeight + 'px';
    }
  } else {
    inp.style.height = 'auto';
    inp.style.height = Math.min(Math.max(inp.scrollHeight, INP_MIN), INP_AUTO_MAX) + 'px';
  }
}
inp.addEventListener('input', autoGrow);

/* 顶边拖拽调节高度 */
const taDrag = document.getElementById('taDrag');
function startDrag(clientY){
  const startY = clientY;
  const startH = inp.offsetHeight;
  taDrag.classList.add('dragging');
  document.body.style.userSelect = 'none';
  document.body.style.cursor = 'ns-resize';
  const move = (y)=>{
    // 上拉 = 变高（Y 变小）
    const dy = startY - y;
    const h = Math.max(INP_MIN, Math.min(INP_MANUAL_MAX, startH + dy));
    inp.style.height = h + 'px';
    manualHeight = h;
  };
  const mm = e=>move(e.clientY);
  const tm = e=>{ if(e.touches[0]) move(e.touches[0].clientY); e.preventDefault(); };
  const end = ()=>{
    taDrag.classList.remove('dragging');
    document.body.style.userSelect = '';
    document.body.style.cursor = '';
    window.removeEventListener('mousemove', mm);
    window.removeEventListener('mouseup', end);
    window.removeEventListener('touchmove', tm);
    window.removeEventListener('touchend', end);
  };
  window.addEventListener('mousemove', mm);
  window.addEventListener('mouseup', end);
  window.addEventListener('touchmove', tm, {passive:false});
  window.addEventListener('touchend', end);
}
taDrag.addEventListener('mousedown', e=>{ startDrag(e.clientY); e.preventDefault(); });
taDrag.addEventListener('touchstart', e=>{ if(e.touches[0]) startDrag(e.touches[0].clientY); e.preventDefault(); }, {passive:false});
// 双击调节条：恢复自动
taDrag.addEventListener('dblclick', ()=>{
  manualHeight = null;
  autoGrow();
});

// 复制最新回复
document.getElementById('btnCopy').addEventListener('click',()=>{
  const btn=document.getElementById('btnCopy');
  if(!lastAgentBody||!(lastAgentBody.dataset.raw||lastAgentBody.textContent).trim()){
    flashBtn(btn,'尚无内容');return;
  }
  const text=lastAgentBody.dataset.raw || lastAgentBody.textContent;
  navigator.clipboard.writeText(text).then(
    ()=>flashBtn(btn,'✓ 已复制到剪贴板'),
    ()=>{
      // fallback
      const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
      ta.select(); try{document.execCommand('copy'); flashBtn(btn,'✓ 已复制到剪贴板')}catch(_){flashBtn(btn,'复制失败')}
      document.body.removeChild(ta);
    }
  );
});
function flashBtn(btn,msg){
  const orig=btn.innerHTML;
  btn.innerHTML=`<span class="ico">✓</span> ${msg}`;
  btn.classList.add('on');
  setTimeout(()=>{btn.innerHTML=orig; btn.classList.remove('on')},1500);
}

// 重新开始
document.getElementById('btnReset').addEventListener('click',()=>{
  if(busy){flashBtn(document.getElementById('btnReset'),'请稍候…');return}
  conv=null; sess.textContent='— — — — — — — —';
  feed.innerHTML=''; n=0; turns=0;
  if(turnCnt) turnCnt.textContent='0';
  lastAgentBody=null;
  pendingAttachments=[]; renderAttachBar();
  greet();
});

function greet(){
  add('agent','嗨嗨～我是影刀 RPA 的需求对接小助手 👋\n\n有什么想让机器人帮你搞定的？直接告诉我就好，不用组织语言，想到啥说啥 💭 我会一步步问你流程、系统、触发时机这些细节，最后帮你整理成一份能直接交付的需求描述 ✨\n\n来，第一句随意说～');
}
greet();
